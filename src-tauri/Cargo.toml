[package]
name = "vrc-chat-tool"
version = "0.2.3"
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.0", features = [] }

[dependencies]
tauri = { version = "1", features = [ "window-show", "window-center", "window-set-size", "window-hide", "window-set-position", "window-close", "protocol-asset", "custom-protocol", "path-all", "http-all", "fs-read-file", "fs-write-file", "clipboard-all"] }
cpal = "0.15"
rosc = "0.7"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }
futures-util = "0.3"
hmac = "0.12"
sha1 = "0.10"
base64 = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
anyhow = "1"
dotenvy = "0.15"
uuid = { version = "1", features = ["v4"] }
url = "2"
urlencoding = "2"
tiny_http = "0.12"
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
once_cell = "1"
winapi = { version = "0.3", features = ["winuser", "libloaderapi", "minwindef", "namedpipeapi", "fileapi", "handleapi", "winbase", "errhandlingapi", "memoryapi", "wincon", "securitybaseapi", "tlhelp32", "processthreadsapi", "winnt", "shellapi"] }
stt-server = { path = "../crates/stt-server" }
openvr = "0.9.0"
openvr_sys = "2.1.4"

[[bin]]
name = "test_e2e"
path = "src/bin/test_e2e.rs"

[lib]
name = "vrc_chat_tool"
path = "src/lib.rs"
