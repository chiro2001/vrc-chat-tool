# STT (Speech-to-Text) local embedded model configuration
# 本地嵌入式语音识别模型配置
#
# This file is ONLY needed when asr_provider = "local_embedded"
# 仅当 asr_provider = "local_embedded" 时需要此文件
#
# MODEL SETUP / 模型安装:
#   Use the Settings UI → select "本地嵌入式推理" → click "下载模型"
#   Or manually download from: https://github.com/k2-fsa/sherpa-onnx/releases
#   或手动下载: https://github.com/k2-fsa/sherpa-onnx/releases
#
# The model_dir path is resolved relative to this config file's location.
# model_dir 路径相对于此配置文件所在目录解析。

server:
  host: "0.0.0.0"
  port: 8765
  max_connections: 1

asr:
  model_dir: "./models"              # Directory containing the model
  model_name: "sherpa-onnx-streaming-zipformer-zh-14M-2023-02-23"  # Model folder name
  encoder: "encoder-epoch-99-avg-1.onnx"
  decoder: "decoder-epoch-99-avg-1.onnx"
  joiner: "joiner-epoch-99-avg-1.onnx"
  tokens: "tokens.txt"
  num_threads: 6
  sample_rate: 16000
  # provider: "cpu"                  # ONNX execution provider (cpu / cuda)

vad:
  enable_endpoint_detection: true
  rule1_min_trailing_silence: 1.2    # Sentence boundary silence (seconds)
  rule2_min_trailing_silence: 0.6    # Sub-phrase boundary silence
  rule3_min_utterance_length: 200.0  # Minimum utterance length

punctuation:
  enabled: false                     # Set to true and fill paths to enable punctuation restoration
  model_dir: "./models"
  model_name: ""
  model_file: ""
