# STT (Speech-to-Text) local embedded model configuration
# 本地嵌入式语音识别模型配置 (hybrid: CTC streaming + SenseVoice)

server:
  host: "0.0.0.0"
  port: 8765
  max_connections: 1

asr:
  model_dir: "./models"
  model_name: "sherpa-onnx-streaming-zipformer-small-ctc-zh-int8-2025-04-01"
  encoder: "model.int8.onnx"
  decoder: "tokens.txt"
  joiner: ""
  tokens: "tokens.txt"
  num_threads: 6
  sample_rate: 16000
  backend: "hybrid"
  streaming_model: "zipformer-small-ctc"
  ctc_model_dir: "./models/sherpa-onnx-streaming-zipformer-small-ctc-zh-int8-2025-04-01"
  sv_model_dir: "./models/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-int8-2024-07-17"
  sv_model: "model.int8.onnx"
  sv_tokens: "tokens.txt"
  language: "zh"

vad:
  enable_endpoint_detection: true
  rule1_min_trailing_silence: 1.2
  rule2_min_trailing_silence: 0.6
  rule3_min_utterance_length: 200.0

punctuation:
  enabled: false
  model_dir: "./models"
  model_name: ""
  model_file: ""
