[package]
name = "vr-hud"
version = "0.2.0"
edition = "2021"

[[bin]]
name = "vrc-chat-hud"
path = "src/main.rs"

[dependencies]
openvr = "0.9"
openvr-sys2 = { version = "2", optional = true }
windows-rs = { package = "windows", version = "0.58", features = [
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Dxgi_Common",
    "Win32_System_SystemServices",
] }
imgui = "0.12"
imgui-winit-support = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"

# IPC: named pipe client
winapi = { version = "0.3", features = ["winbase", "fileapi", "namedpipeapi", "handleapi", "minwinbase", "memoryapi"] }
