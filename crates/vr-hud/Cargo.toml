[package]
name = "vr-hud"
version = "0.2.0"
edition = "2021"

[[bin]]
name = "vrc-chat-hud"
path = "src/main.rs"

[dependencies]
openvr = "0.9"
fontdue = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
ctrlc = "3"
tracing = "0.1"
tracing-subscriber = "0.3"

# IPC: named pipe client
winapi = { version = "0.3", features = ["winbase", "fileapi", "namedpipeapi", "handleapi", "minwinbase", "memoryapi", "winerror", "errhandlingapi"] }
